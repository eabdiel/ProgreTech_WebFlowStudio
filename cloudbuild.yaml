substitutions:
  _REGION: us-east1
  _SERVICE: alm-webflow-studio
steps:
- name: gcr.io/cloud-builders/docker
  args: ["build","-t","gcr.io/$PROJECT_ID/${_SERVICE}:$SHORT_SHA","."]
- name: gcr.io/google.com/cloudsdktool/cloud-sdk
  entrypoint: gcloud
  args: ["run","deploy","${_SERVICE}","--image=gcr.io/$PROJECT_ID/${_SERVICE}:$SHORT_SHA","--region=${_REGION}","--platform=managed","--port=8080","--memory=2Gi","--cpu=2","--concurrency=4","--max-instances=1"]
images:
- "gcr.io/$PROJECT_ID/${_SERVICE}:$SHORT_SHA"
